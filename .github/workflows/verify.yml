name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: acceptance (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install checksum-pinned official compiler
        run: make bootstrap
      - name: Execute checked suites and real-process acceptance
        env:
          CAIRN_OFFLINE: '1'
        run: make verify
      - name: Validate and independently replay the saved source-bound receipt
        run: make verify-evidence replay-evidence
      - name: Run the complete operator walkthrough
        run: |
          mkdir -p .runtime
          ./bin/cairn demo .runtime/ci-demo
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: evidence-${{ matrix.os }}
          path: |
            build/evidence/
            .runtime/ci-demo/result.json
            .runtime/ci-demo/report.html
          retention-days: 14

  sanitizers:
    name: clang address and undefined behavior sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: make bootstrap
      - name: Checked debug suites under Clang sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >-
          make NIMFLAGS='--cc:clang --passC:-fsanitize=address,undefined
          --passL:-fsanitize=address,undefined --passC:-fno-omit-frame-pointer' test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: sanitizer-log
          path: build/evidence/unit-debug.log
